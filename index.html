<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b70">
  <meta name="description" content="Halaman akses aplikasi Penilaian Senja.">
  <title>Penilaian Senja | Portal Aplikasi</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #123b70;
      --blue: #2563eb;
      --ink: #172033;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(96,165,250,.35), transparent 32%),
        linear-gradient(135deg, #eff6ff 0%, #f8fafc 52%, #dbeafe 100%);
    }
    .card {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 48px);
      text-align: center;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(148,163,184,.3);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .13);
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border-radius: 22px;
      color: white;
      font-size: 36px;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      box-shadow: 0 12px 28px rgba(37,99,235,.25);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(2rem, 7vw, 2.7rem);
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    .description {
      max-width: 410px;
      margin: 18px auto 28px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 14px 22px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(100deg, var(--navy), var(--blue));
      text-decoration: none;
      font-weight: 750;
      box-shadow: 0 10px 22px rgba(37,99,235,.22);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(37,99,235,.3);
    }
    .button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 4px;
    }
    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.6;
    }
    footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      color: #64748b;
      font-size: .82rem;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand-mark" aria-hidden="true">✦</div>
    <p class="eyebrow">Portal Aplikasi</p>
    <h1>Penilaian Senja</h1>
    <p class="description">
      Selamat datang. Tekan tombol di bawah untuk membuka aplikasi
      Penilaian Senja dan melanjutkan ke halaman penilaian.
    </p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbxVmC-bS1UO3MdmonA1gA3HV-9c8jLfpetLr4kc-Bq7Tp1ilIRt86aOAkeXPWc4ez4/exec"
      target="_blank"
      rel="noopener noreferrer"
    >
      Buka Aplikasi <span aria-hidden="true">→</span>
    </a>

    <p class="note">
      Jika diminta, silakan login dengan akun Google yang memiliki izin akses aplikasi.
    </p>

    <footer>Penilaian Senja · Portal akses aplikasi</footer>
  </main>
</body>
</html>
